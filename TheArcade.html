<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Arcade</title>
    <!-- Tailwind CSS CDN for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "Inter", sans-serif; /* Using Inter font */
            background-color: #1a202c; /* Dark background for an arcade feel */
            color: #e2e8f0; /* Light text color */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        canvas {
            background-color: #000; /* Black background for the canvas */
            border: 4px solid #4a5568; /* Border around the canvas */
            border-radius: 12px; /* Rounded corners for the canvas */
            display: block;
            margin: 20px auto;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.5); /* Shadow for depth */
            /* Ensure the canvas element itself is responsive, while JS sets its drawing buffer size */
            max-width: 90vw; /* Responsive width for display */
            max-height: 70vh; /* Responsive height for display */
            width: auto;
            height: auto;
            aspect-ratio: 16 / 9; /* Maintain aspect ratio for the CSS display */
        }
        .message-box {
            background-color: #2d3748;
            border: 1px solid #4a5568;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-900 text-gray-100 p-5">
    <h1 class="text-5xl font-bold mb-8 text-yellow-400">The Arcade</h1>

    <div id="message-container" class="message-box hidden">
        <p id="message-text"></p>
        <button onclick="hideMessageBox()" class="mt-4 px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition duration-300">OK</button>
    </div>

    <!-- The game canvas -->
    <canvas id="gameCanvas"></canvas>

    <p class="text-lg mt-6">
        No game selected. Please choose a game from the <a href="games.html" class="text-blue-400 hover:underline">game selection page</a>.
    </p>

    <script>
        // Global variables for canvas, context, and currently loaded game
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let currentGame = null; // To keep track of the currently loaded game
        let currentInitFunction = null; // Stores the function to re-draw the current game (for resizing)
        let currentScriptElement = null; // Stores the currently loaded external script element

        // Define a desired aspect ratio (e.g., 16:9 for landscape mobile games)
        const CANVAS_ASPECT_RATIO = 16 / 9; // Width / Height

        /**
         * Displays a message in a custom message box.
         * @param {string} message The message to display.
         */
        function showMessageBox(message) {
            document.getElementById('message-text').textContent = message;
            document.getElementById('message-container').classList.remove('hidden');
        }

        /**
         * Hides the custom message box.
         */
        function hideMessageBox() {
            document.getElementById('message-container').classList.add('hidden');
        }

        /**
         * Placeholder functions for internal demo games.
         * In a real scenario, these would typically be in their own gameName.js file
         * and would be named window.initGame_gameName = function(canvas, ctx, showMessageBox) { ... }
         */
        function initGame_circle(canvas, ctx, showMessageBox) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.15, 0, Math.PI * 2);
            ctx.fillStyle = 'red';
            ctx.fill();
            ctx.closePath();
            showMessageBox('Circle Game Loaded!');
        }

        function initGame_rectangle(canvas, ctx, showMessageBox) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
            ctx.fillStyle = 'blue';
            const rectWidth = canvas.width * 0.3;
            const rectHeight = canvas.height * 0.3;
            ctx.fillRect(canvas.width / 2 - rectWidth / 2, canvas.height / 2 - rectHeight / 2, rectWidth, rectHeight);
            showMessageBox('Rectangle Game Loaded!');
        }

        function initGame_triangle(canvas, ctx, showMessageBox) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
            ctx.fillStyle = 'green';
            ctx.beginPath();
            const size = Math.min(canvas.width, canvas.height) * 0.2;
            ctx.moveTo(canvas.width / 2, canvas.height / 2 - size);
            ctx.lineTo(canvas.width / 2 + size * Math.cos(Math.PI / 6), canvas.height / 2 + size * Math.sin(Math.PI / 6));
            ctx.lineTo(canvas.width / 2 - size * Math.cos(Math.PI / 6), canvas.height / 2 + size * Math.sin(Math.PI / 6));
            ctx.closePath();
            ctx.fill();
            showMessageBox('Triangle Game Loaded!');
        }


        /**
         * Function to load a specific game into the canvas.
         * @param {string} gameName The identifier of the game to load (e.g., 'rocketbabu').
         */
        function loadGame(gameName) {
            // Clear any previous interval/animation frames or event listeners from the old game
            // This is crucial to prevent multiple games from running simultaneously or interfering.
            if (window.cleanupGame && typeof window.cleanupGame === 'function') {
                window.cleanupGame(); // Call cleanup function if provided by the previous game
                delete window.cleanupGame; // Remove it to prevent accidental calls
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
            currentGame = gameName; // Update global game state

            // Remove previous external script if it exists to avoid conflicts
            if (currentScriptElement && currentScriptElement.parentNode) {
                currentScriptElement.parentNode.removeChild(currentScriptElement);
                currentScriptElement = null;
                currentInitFunction = null; // Clear previous game's init function
            }

            // Define the expected initialization function name for the game
            const initFunctionName = `initGame_${gameName}`;

            // Check if the game's initialization function is already defined (for built-in/test games)
            if (typeof window[initFunctionName] === 'function') {
                currentInitFunction = () => window[initFunctionName](canvas, ctx, showMessageBox);
                currentInitFunction(); // Call the function
                return; // Game loaded, exit
            }

            // If not a built-in game, try to load it as an external .js file
            const scriptPath = `games/${gameName}.js`; // Assuming all external games are in a 'games' folder
            const script = document.createElement('script');
            script.src = scriptPath;
            script.type = 'text/javascript';
            currentScriptElement = script; // Store reference to the script element

            script.onload = () => {
                // After the script loads, check if its expected initialization function is now available
                if (typeof window[initFunctionName] === 'function') {
                    currentInitFunction = () => window[initFunctionName](canvas, ctx, showMessageBox);
                    currentInitFunction(); // Call the game's initialization function
                    showMessageBox(gameName.charAt(0).toUpperCase() + gameName.slice(1) + ' Loaded!');
                } else {
                    showMessageBox('Error: Game initialization function "' + initFunctionName + '" not found after loading ' + gameName + '.js. Check your game file.');
                    console.error(`Expected function: ${initFunctionName} not found in ${scriptPath}`);
                }
            };

            script.onerror = () => {
                showMessageBox('Error loading game script: ' + gameName + '. Please check the file path: ' + scriptPath);
                console.error('Failed to load script: ' + scriptPath);
            };

            document.body.appendChild(script);
        }

        /**
         * Adjusts canvas size to maintain the desired aspect ratio and fit within its parent.
         * This sets the internal drawing resolution of the canvas.
         */
        function resizeCanvas() {
            const parent = canvas.parentElement; // Get the parent element to determine available space
            if (!parent) return;

            let newWidth = parent.clientWidth;
            let newHeight = parent.clientHeight;

            let calculatedHeight = newWidth / CANVAS_ASPECT_RATIO;
            let calculatedWidth = newHeight * CANVAS_ASPECT_RATIO;

            if (calculatedHeight <= newHeight) {
                // If the height calculated by the width fits, use that
                canvas.width = newWidth;
                canvas.height = calculatedHeight;
            } else {
                // Otherwise, fit by height
                canvas.width = calculatedWidth;
                canvas.height = newHeight;
            }

            // Ensure canvas has a reasonable minimum size to be visible on very small screens
            if (canvas.width < 300 || canvas.height < 150) { // Example minimums
                 canvas.width = 480; // Fallback resolution for very small displays
                 canvas.height = 270;
            }

            // Redraw the game content if an initialization function is loaded
            if (currentInitFunction) {
                currentInitFunction(); // Call the stored function to redraw the game
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height); // Just clear if no game loaded
            }
        }

        /**
         * Parses URL parameters to get the selected game and initializes the canvas.
         */
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const gameToLoad = urlParams.get('game'); // Get the 'game' parameter from the URL

            if (gameToLoad) {
                // If a game parameter is found, set it as the current game and load it
                currentGame = gameToLoad;
                loadGame(gameToLoad);
            } else {
                // If no game parameter, show a message and just resize the canvas
                showMessageBox('Welcome to the Arcade! No game selected. Please choose one from the game selection page.');
            }

            // Initial canvas resize and add event listener
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        };
    </script>
</body>
</html>
