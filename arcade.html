<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade - Babu Science</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@100;300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="arcade.css?v=8">

  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
</head>
<body>

  <h1 class="arcade-title">Babu Arcade</h1>

  <div class="arcade-nav">
    <a href="/" class="arcade-navlink">Home</a>
    <a href="archive/explore" class="arcade-navlink">Explore</a>
  </div>

  <main class="arcade-shelf" id="arcadeShelf">
    <p class="arcade-status">Loading games&hellip;</p>
  </main>

  <script>
    (function () {
      var shelf = document.getElementById('arcadeShelf');
      var prefersReducedMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function cartEl(game) {
        var isExternal = game.type === 'external';
        var a = document.createElement('a');
        a.className = 'cart';
        a.href = isExternal ? game.url : 'arcade/play?game=' + encodeURIComponent(game.id);
        if (isExternal) {
          a.target = '_blank';
          a.rel = 'noopener';
        }

        var shell = document.createElement('span');
        shell.className = 'cart-shell';

        var shadow = document.createElement('span');
        shadow.className = 'cart-shadow';

        var side = document.createElement('span');
        side.className = 'cart-side';

        var top = document.createElement('span');
        top.className = 'cart-top';

        var label = document.createElement('span');
        label.className = 'cart-label';
        var img = document.createElement('img');
        img.className = 'cart-art';
        img.src = 'arcade/' + game.thumbnail;
        img.alt = game.name + ' cover art';
        img.loading = 'lazy';
        label.appendChild(img);

        var shine = document.createElement('span');
        shine.className = 'cart-shine';
        label.appendChild(shine);

        // Shimmer is JS-triggered (not pure CSS :hover) and guarded against
        // re-starting mid-sweep. The cart's 3D hover tilt physically moves
        // .cart-shell out from under a stationary cursor, which can make the
        // browser fire mouseenter/mouseleave more than once for a single
        // hover (especially entering near an edge) - with a plain CSS
        // `:hover { animation }` rule each of those toggles restarts the
        // animation from scratch, which read as the shimmer flashing
        // multiple times per hover. Gating on "already running? ignore"
        // collapses that chatter back down to one clean sweep.
        if (!prefersReducedMotion) {
          var shineRunning = false;
          shine.addEventListener('animationend', function () {
            shine.classList.remove('is-active');
            shineRunning = false;
          });
          var triggerShine = function () {
            if (shineRunning) return;
            shineRunning = true;
            shine.classList.add('is-active');
          };
          a.addEventListener('pointerenter', triggerShine);
          a.addEventListener('focus', triggerShine);
        }

        var foot = document.createElement('span');
        foot.className = 'cart-foot';

        shell.appendChild(shadow);
        shell.appendChild(side);
        shell.appendChild(top);
        shell.appendChild(label);
        shell.appendChild(foot);

        var EXT_ICON = '<svg class="ext-icon" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 8L8 2M8 2H3.5M8 2V6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        var name = document.createElement('span');
        name.className = 'cart-name';
        name.innerHTML = game.name + (isExternal ? EXT_ICON : '');

        a.appendChild(shell);
        a.appendChild(name);
        return a;
      }

      fetch('arcade/games.json')
        .then(function (res) {
          if (!res.ok) throw new Error('games.json ' + res.status);
          return res.json();
        })
        .then(function (games) {
          shelf.innerHTML = '';
          if (!games.length) {
            shelf.innerHTML = '<p class="arcade-status">No games yet. Add one to arcade/games.json.</p>';
            return;
          }
          games.forEach(function (game) {
            shelf.appendChild(cartEl(game));
          });
        })
        .catch(function (err) {
          console.error(err);
          shelf.innerHTML = '<p class="arcade-status">Couldn&rsquo;t load the game list. If you&rsquo;re viewing this from a local file, games.json needs the page served over http:// (try <code>python3 -m http.server</code>) &mdash; it&rsquo;ll load fine once deployed.</p>';
        });
    })();
  </script>

</body>
</html>
